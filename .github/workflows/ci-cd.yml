name: CI/CD

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read
  checks: write
  issues: write
  pull-requests: read

jobs:
  conventional-commits-warning:
    name: conventional-commits-warning
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'rerun-ci')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Report conventional commit warning
        uses: actions/github-script@v7
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        with:
          script: |
            const { execFileSync } = require("node:child_process");
            const pattern = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|deps)(\([A-Za-z0-9_.-]+\))?(!)?: .+/;
            const invalid = [];
            if (!pattern.test(process.env.PR_TITLE)) invalid.push(`PR title: ${process.env.PR_TITLE}`);
            const subjects = execFileSync("git", ["log", "--no-merges", "--format=%s", `${process.env.BASE_SHA}..${process.env.HEAD_SHA}`], { encoding: "utf8" }).split(/\r?\n/).filter(Boolean);
            for (const subject of subjects) if (!pattern.test(subject)) invalid.push(`Commit: ${subject}`);
            const marker = "<!-- conventional-commits-warning -->";
            const valid = invalid.length === 0;
            const summary = valid ? "PR title and commit messages follow Conventional Commits." : `The PR remains mergeable, but these messages do not follow Conventional Commits:\n\n${invalid.map(item => `- ${item}`).join("\n")}`;
            try { await github.rest.checks.create({ owner: context.repo.owner, repo: context.repo.repo, name: "conventional-commits", head_sha: process.env.HEAD_SHA, status: "completed", conclusion: valid ? "success" : "neutral", output: { title: valid ? "Conventional Commits" : "Conventional Commits warning", summary } }); } catch (error) { core.warning(`Could not publish the Conventional Commits check: ${error.message}`); }
            try {
              const comments = await github.paginate(github.rest.issues.listComments, { owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, per_page: 100 });
              const existing = comments.find(comment => comment.user?.type === "Bot" && comment.body?.includes(marker));
              if (invalid.length) { const body = `${marker}\n **Conventional Commits:** aviso não bloqueante.\n\n${summary}\n\nO CI funcional continua sendo validado normalmente.`; if (existing) await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body }); else await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body }); }
              else if (existing) await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body: `${marker}\n **Conventional Commits:** aviso resolvido; o título e os commits estão no padrão.` });
            } catch (error) { core.warning(`Could not publish the Conventional Commits comment: ${error.message}`); }

  ci:
    name: ci
    runs-on: ubuntu-latest
    if: github.event.action != 'labeled' || github.event.label.name == 'rerun-ci'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate scaffold
        run: |
          test -f README.md
          test -f config.yaml
          test -f requirements.txt
          test -f scripts/apply_sql.py
          test -f sql/versionamento.sql

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  database-integration:
    name: database-integration
    runs-on: ubuntu-latest
    needs: ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: ouros_integration
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_ROOT_DB: postgres
      POSTGRES_ROOT_USER: ouros_bootstrap
      POSTGRES_ROOT_PASSWORD: bootstrap
      MS_AUTH_SERVICE_PASSWORD: integration-auth-secret
      GITHUB_COMMIT_MESSAGE: database integration test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Create limited bootstrap and owner roles
        run: |
          python - <<'PY'
          import psycopg2

          conn = psycopg2.connect(
              host="127.0.0.1", port=5432, dbname="postgres",
              user="postgres", password="postgres"
          )
          conn.autocommit = True
          with conn.cursor() as cur:
              cur.execute(
                  "CREATE ROLE app LOGIN PASSWORD %s NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS",
                  ("app",),
              )
              cur.execute(
                  "CREATE ROLE ouros_bootstrap LOGIN PASSWORD %s CREATEDB CREATEROLE NOSUPERUSER NOREPLICATION NOBYPASSRLS",
                  ("bootstrap",),
              )
              cur.execute("GRANT app TO ouros_bootstrap WITH SET TRUE")
          conn.close()
          PY

      - name: Bootstrap database from zero
        run: python scripts/apply_sql.py

      - name: Simulate real user changes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import psycopg2

          conn = psycopg2.connect(
              host="127.0.0.1", port=5432, dbname="ouros_integration",
              user="app", password="app"
          )
          with conn:
              with conn.cursor() as cur:
                  cur.execute("SELECT id FROM farms ORDER BY id LIMIT 1")
                  farm_id = cur.fetchone()[0]
                  cur.execute("UPDATE farms SET chickens_now = 123456 WHERE id = %s", (farm_id,))

                  cur.execute("SELECT id FROM farm_owners ORDER BY id LIMIT 1")
                  owner_id = cur.fetchone()[0]
                  cur.execute("UPDATE farm_owners SET first_access = FALSE WHERE id = %s", (owner_id,))

                  cur.execute("SELECT id FROM water_registries ORDER BY id LIMIT 1")
                  water_id = cur.fetchone()[0]
                  cur.execute(
                      "UPDATE water_registries SET end_hydrometer = start_hydrometer + 777 WHERE id = %s",
                      (water_id,),
                  )

          Path("/tmp/ouros-user-state.json").write_text(
              json.dumps({"farm_id": farm_id, "owner_id": owner_id, "water_id": water_id}),
              encoding="utf-8",
          )
          conn.close()
          PY

      - name: Reapply versioning
        run: python scripts/apply_sql.py

      - name: Verify user data was preserved
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import psycopg2

          state = json.loads(Path("/tmp/ouros-user-state.json").read_text(encoding="utf-8"))
          conn = psycopg2.connect(
              host="127.0.0.1", port=5432, dbname="ouros_integration",
              user="app", password="app"
          )
          with conn.cursor() as cur:
              cur.execute("SELECT chickens_now FROM farms WHERE id = %s", (state["farm_id"],))
              assert cur.fetchone()[0] == 123456, "versioning overwrote farms.chickens_now"

              cur.execute("SELECT first_access FROM farm_owners WHERE id = %s", (state["owner_id"],))
              assert cur.fetchone()[0] is False, "versioning overwrote farm_owners.first_access"

              cur.execute(
                  "SELECT end_hydrometer - start_hydrometer FROM water_registries WHERE id = %s",
                  (state["water_id"],),
              )
              assert cur.fetchone()[0] == 777, "versioning overwrote water registry data"
          conn.close()
          PY

      - name: Simulate lost application data with version history intact
        run: |
          python - <<'PY'
          import psycopg2
          from psycopg2 import sql

          conn = psycopg2.connect(
              host="127.0.0.1", port=5432, dbname="ouros_integration",
              user="app", password="app"
          )
          with conn:
              with conn.cursor() as cur:
                  cur.execute(
                      "SELECT COUNT(*) FROM controle_scripts_sql WHERE arquivo = 'dataload_inicial.sql'"
                  )
                  assert cur.fetchone()[0] == 1, "seed execution history must exist before recovery test"

                  cur.execute(
                      "SELECT tablename FROM pg_tables "
                      "WHERE schemaname = 'public' "
                      "AND tablename NOT IN ('controle_scripts_sql', 'controle_versoes')"
                  )
                  tables = [row[0] for row in cur.fetchall()]
                  assert tables, "expected application tables before recovery test"
                  query = sql.SQL("TRUNCATE TABLE {} CASCADE").format(
                      sql.SQL(", ").join(sql.Identifier(table) for table in tables)
                  )
                  cur.execute(query)
          conn.close()
          PY

      - name: Recover seed with stale version history
        run: python scripts/apply_sql.py

      - name: Verify seed was restored
        run: |
          python - <<'PY'
          import psycopg2

          conn = psycopg2.connect(
              host="127.0.0.1", port=5432, dbname="ouros_integration",
              user="app", password="app"
          )
          with conn.cursor() as cur:
              for table in ("addresses", "enterprises", "farms", "farm_owners", "company_employees"):
                  cur.execute(f'SELECT COUNT(*) FROM "{table}"')
                  count = cur.fetchone()[0]
                  assert count > 0, f"seed recovery left {table} empty"
          conn.close()
          PY

  sql:
    name: sql
    runs-on: ubuntu-latest
    needs: [ci, database-integration]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate migration naming
        run: |
          find sql -type f -name '*.sql' | sort | grep -q .
          if grep -E '^[[:space:]]*-[[:space:]]+file:' config.yaml | grep -Ev '^[[:space:]]*-[[:space:]]+file:[[:space:]]+[A-Za-z0-9_./-]+\.sql[[:space:]]*$' | grep -q .; then
            echo "Invalid SQL file in execution_order"
            exit 1
          fi

      - name: Block destructive SQL
        run: |
          if grep -RInEi '\b(TRUNCATE|DROP[[:space:]]+(DATABASE|TABLE|SCHEMA|VIEW)|DROP[[:space:]]+COLUMN)\b' sql; then
            echo "Destructive SQL is forbidden"
            exit 1
          fi