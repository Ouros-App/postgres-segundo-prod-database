project: postgres-segundo-prod-database
database:
  engine: postgresql
  host: ${POSTGRES_HOST}
  port: ${POSTGRES_PORT}
  name: ${POSTGRES_DB}
  bootstrap:
    db: ${POSTGRES_ROOT_DB}
    user: ${POSTGRES_ROOT_USER}
    password: ${POSTGRES_ROOT_PASSWORD}
  owner:
    user: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  sql_path: sql
  version_table: controle_versoes
  version_schema_file: versionamento.sql
  # on_change: somente definicoes idempotentes que nao alteram dados de usuarios.
  # once: migrations imutaveis, executadas no maximo uma vez.
  # never: scripts legados/desativados que nao podem rodar automaticamente.
  execution_order:
    - file: banco_ouros_fisico.sql
      mode: on_change
    - file: funcoes_consumo_metas.sql
      mode: on_change
    - file: atualiza_updated_at_analytics.sql
      mode: on_change
    - file: analytics_sync_user.sql
      mode: on_change
    - file: keycloak_user_link.sql
      mode: on_change
    - file: ms_auth_service.sql
      mode: on_change
    - file: triggers_logs.sql
      mode: on_change
    - file: atualiza_lots_farm-owners.sql
      mode: once
    - file: atualiza_farms-chicken-left.sql
      mode: once
    - file: dataload_inicial.sql
      mode: once
      # Seed somente em banco realmente vazio. Se qualquer dado de aplicacao existir,
      # o runner registra baseline e nunca injeta/substitui dados sinteticos.
      baseline_query: >-
        SELECT EXISTS (
          SELECT 1 FROM addresses LIMIT 1
        ) OR EXISTS (
          SELECT 1 FROM enterprises LIMIT 1
        ) OR EXISTS (
          SELECT 1 FROM farms LIMIT 1
        ) OR EXISTS (
          SELECT 1 FROM farm_owners LIMIT 1
        ) OR EXISTS (
          SELECT 1 FROM company_employees LIMIT 1
        ) OR EXISTS (
          SELECT 1 FROM adms LIMIT 1
        )
    - file: atualiza_consumo_mensal.sql
      mode: never
    - file: views_galinhas_consumo.sql
      mode: on_change
    - file: dataload_lots_farm-owners.sql
      mode: never
    - file: atualiza_password.sql
      mode: once
    - file: midas-user.sql
      mode: on_change
    - file: midas-resource-import.sql
      mode: on_change
