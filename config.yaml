project: postgres-segundo-prod-database
database:
  engine: postgresql
  host: ${POSTGRES_HOST}
  port: ${POSTGRES_PORT}
  name: ${POSTGRES_DB}
  bootstrap:
    db: ${POSTGRES_ROOT_DB}
    user: ${POSTGRES_ROOT_USER}
    password: ${POSTGRES_ROOT_PASSWORD}
  owner:
    user: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  sql_path: sql
  version_table: controle_versoes
  version_schema_file: versionamento.sql
  # Adicione os arquivos na ordem em que devem ser executados.
  # mode: once | on_change | always | never
  execution_order:
    - file: banco_ouros_fisico.sql
      mode: on_change
    - file: atualiza_lots_farm-owners.sql
      mode: on_change
    - file: dataload_inicial.sql
      mode: once
      baseline_query: >-
        SELECT NOT EXISTS (
          SELECT expected.document_number
          FROM (VALUES
            ('20000000001'), ('20000000002'), ('20000000003'), ('20000000004'), ('20000000005'),
            ('20000000006'), ('20000000007'), ('20000000008'), ('20000000009'), ('20000000010'),
            ('20000000011'), ('20000000012'), ('20000000013'), ('20000000014'), ('20000000015'),
            ('20000000016'), ('20000000017'), ('20000000018'), ('20000000019'), ('20000000020')
          ) AS expected(document_number)
          WHERE NOT EXISTS (
            SELECT 1
            FROM company_employees actual
            WHERE actual.document_number = expected.document_number
          )
        )
    - file: dataload_lots_farm-owners.sql
      mode: once
    - file: atualiza_password.sql
      mode: once
    - file: midas-user.sql
      mode: on_change
    - file: midas-resource-import.sql
      mode: on_change
